x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-portal-solicitacoes-backend:local}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  HTTP_ADDR: ":8080"
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://portal:portal@postgres:5432/portal?sslmode=disable}
  DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-3s}
  DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-10}
  DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}
  DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-30m}
  DATABASE_CONN_MAX_IDLE_TIME: ${DATABASE_CONN_MAX_IDLE_TIME:-5m}
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
  MIGRATIONS_DIR: /app/db/migrations
  TRUSTED_ORIGINS: ${COMPOSE_TRUSTED_ORIGINS:-http://127.0.0.1:8080}
  SESSION_DURATION: ${SESSION_DURATION:-8h}
  SESSION_TOKEN_BYTES: ${SESSION_TOKEN_BYTES:-32}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
  LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-15m}
  LOGIN_RATE_LIMIT_MAX_ENTRIES: ${LOGIN_RATE_LIMIT_MAX_ENTRIES:-10000}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *backend-image
    command: ["/app/migrate", "up"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *backend-image
    command: ["/app/api"]
    environment: *backend-environment
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-portal-solicitacoes-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_PATH: /api/v1
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  seed:
    <<: *backend-image
    profiles: ["demo"]
    command: ["/app/seed"]
    environment:
      <<: *backend-environment
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_USER1_USERNAME: ${DEMO_USER1_USERNAME:-colaborador1}
      DEMO_USER1_DISPLAY_NAME: ${DEMO_USER1_DISPLAY_NAME:-Colaborador 1}
      DEMO_USER1_PASSWORD: ${DEMO_USER1_PASSWORD:-DemoLocal-Colaborador1}
      DEMO_USER2_USERNAME: ${DEMO_USER2_USERNAME:-colaborador2}
      DEMO_USER2_DISPLAY_NAME: ${DEMO_USER2_DISPLAY_NAME:-Colaborador 2}
      DEMO_USER2_PASSWORD: ${DEMO_USER2_PASSWORD:-DemoLocal-Colaborador2}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"

volumes:
  postgres_data:
